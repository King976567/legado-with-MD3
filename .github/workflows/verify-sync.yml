name: Verify sync PR

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base:
        required: true
        type: string
      stage:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      ref:
        description: 待验证提交 SHA
        required: true
        type: string
      base:
        description: 目标基线 SHA
        required: true
        type: string
      stage:
        description: 同步阶段
        type: choice
        options: [upstream, nas]
        required: true
  pull_request:
    branches: [main, nas-md3]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  build:
    if: >-
      github.repository == 'King976567/legado-with-MD3' &&
      (github.event_name != 'pull_request' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.head_ref, 'automation/sync-')))
    strategy:
      fail-fast: false
      matrix:
        product: [Comic]
        label: [comic]
        shard: [0, 1, 2, 3]
    name: Verify sync (${{ matrix.label }}, shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERIFY_SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
      VERIFY_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFY_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify target baseline
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
          git merge-base --is-ancestor "$VERIFY_BASE" HEAD
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare verification
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle
          chmod +x gradlew
      # Keep cold compilation out of the test execution budget. Every test class
      # still runs in its own JVM, serially, with the existing 20-minute limit.
      # Instrumentation test compilation is part of the Comic verification gate.
      - name: Compile JVM and Android test sources
        timeout-minutes: 20
        run: |
          ./gradlew :app:compileApp${{ matrix.product }}DebugUnitTestKotlin \
            :app:compileApp${{ matrix.product }}DebugAndroidTestKotlin \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache
      - name: JVM tests
        id: tests
        timeout-minutes: 20
        run: |
          ./gradlew testApp${{ matrix.product }}DebugUnitTest \
            --init-script .github/scripts/shard-tests.gradle \
            --project-prop ciTestShardIndex=${{ matrix.shard }} \
            --project-prop ciTestShardCount=4 \
            --project-prop ciTestSourceSha="$VERIFY_SHA" \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache
      - name: Lint and architecture
        if: ${{ !cancelled() && matrix.shard == 0 && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew lintApp${{ matrix.product }}Debug verifyConfigArchitecture \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache
      - name: Arm64 debug APK
        if: ${{ !cancelled() && matrix.shard == 0 && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew assembleApp${{ matrix.product }}Debug \
            --init-script .github/scripts/arm64-only.gradle \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache
      - name: Upload arm64 trial APK
        if: ${{ success() && matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: nas-sync-arm64-${{ matrix.label }}-${{ env.VERIFY_SHA }}
          path: app/build/outputs/apk/app${{ matrix.product }}/debug/*arm64-v8a*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Upload shard inventory and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-test-shard-${{ matrix.shard }}-${{ env.VERIFY_SHA }}
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/test-shards/testApp${{ matrix.product }}DebugUnitTest/shard-${{ matrix.shard }}/**
            app/build/reports/tests/testApp${{ matrix.product }}DebugUnitTest/**
            app/build/reports/lint-results-app${{ matrix.product }}Debug.*
      - name: JVM diagnostics on failure
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          ps -eo pid,ppid,stat,etime,rss,args
          jps -l | while read -r pid command; do
            if [[ "$command" != *Jps ]]; then
              timeout 10s jcmd "$pid" Thread.print || true
            fi
          done

  coverage:
    needs: build
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERIFY_SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.VERIFY_SHA }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sync-test-shard-*-${{ env.VERIFY_SHA }}
          path: shard-artifacts
      - name: Verify complete Comic test coverage
        run: |
          test "$(git rev-parse HEAD)" = "$VERIFY_SHA"
          python3 .github/scripts/test_verify_test_shards.py
          python3 .github/scripts/verify_test_shards.py \
            --artifacts-dir shard-artifacts --shard-count 4 \
            --source-sha "$VERIFY_SHA" --task-path :app:testAppComicDebugUnitTest
          test '${{ needs.build.result }}' = success

  result:
    # Keep the Comic gate independent from the candidate's read-only Gradle job.
    needs: [build, coverage]
    if: ${{ always() && needs.build.result != 'skipped' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERIFY_SHA: ${{ inputs.ref || github.event.pull_request.head.sha }}
      VERIFY_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
      STAGE: ${{ inputs.stage || (github.base_ref == 'main' && 'upstream' || 'nas') }}
      BUILD_RESULT: ${{ needs.build.result }}
      COVERAGE_RESULT: ${{ needs.coverage.result }}
    steps:
      # Candidate Gradle code never receives this job's write token.
      - name: Publish verification status
        shell: bash
        run: |
          set -euo pipefail
          target=main
          if [[ "$STAGE" == nas ]]; then target=nas-md3; fi
          current_base="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$target" --jq .object.sha)"
          state=failure
          description="验证失败或已取消，请查看报告"
          if [[ "$BUILD_RESULT" == success && "$COVERAGE_RESULT" == success && "$current_base" == "$VERIFY_BASE" ]]; then
            state=success
            description="Comic 四片测试及覆盖、lint、架构、arm64 APK 全部通过，请人工确认合并"
          elif [[ "$current_base" != "$VERIFY_BASE" ]]; then
            description="目标分支已更新，请重新运行同步验证最新结果"
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$VERIFY_SHA" \
            -f "state=$state" -f "context=Sync verification ($STAGE)" \
            -f "description=$description" -f "target_url=$run_url"
          echo "$description — $run_url" >> "$GITHUB_STEP_SUMMARY"
          test "$state" = success
