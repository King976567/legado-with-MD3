name: Verify

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fork 门禁只验证 Comic 完整版；上游 Core 源码仍随同步保留。
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - product: Comic
            label: comic
    name: Verify (${{ matrix.label }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # concurrency 放在 job 层：workflow 层的 concurrency 不保证能解析 matrix 上下文。
    concurrency:
      group: verify-${{ github.workflow }}-${{ github.ref }}-${{ matrix.product }}
      cancel-in-progress: true
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 auto-release.yml 同一处理：settings.gradle 里的 aliyun 镜像面向国内开发机，
      # 在 GitHub runner 上会 502，且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      # Separate cold compilation from the unchanged test execution budget.
      # Instrumentation test compilation is part of the Comic verification gate.
      - name: Compile JVM and Android test sources
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          ./gradlew :app:compileApp${{ matrix.product }}DebugUnitTestKotlin \
            :app:compileApp${{ matrix.product }}DebugAndroidTestKotlin \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: JVM tests
        id: tests
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          ./gradlew testApp${{ matrix.product }}DebugUnitTest \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      # Run full, unfiltered JVM tests and lint, including the architecture gate.
      - name: Lint and architecture
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew lintApp${{ matrix.product }}Debug verifyConfigArchitecture \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: Debug build
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew assembleApp${{ matrix.product }}Debug \
            --init-script .github/scripts/arm64-only.gradle \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/build/test-results/testApp${{ matrix.product }}DebugUnitTest/**
            app/build/reports/tests/testApp${{ matrix.product }}DebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports-${{ matrix.label }}
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-app${{ matrix.product }}Debug.html
            app/build/reports/lint-results-app${{ matrix.product }}Debug.xml
            app/build/reports/lint-results-app${{ matrix.product }}Debug.txt
            app/build/reports/lint-results-app${{ matrix.product }}Debug.sarif

      - name: JVM diagnostics on failure
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          ps -eo pid,ppid,stat,etime,rss,args
          jps -l | while read -r pid command; do
            if [[ "$command" != *Jps ]]; then
              timeout 10s jcmd "$pid" Thread.print || true
            fi
          done
