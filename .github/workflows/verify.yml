name: Verify

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - '**/modules/web/**'
  pull_request:
    paths-ignore:
      - '**/modules/web/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 与 auto-release.yml 同一处理：settings.gradle 里的 aliyun 镜像面向国内开发机，
      # 在 GitHub runner 上会 502，且 Gradle 一旦判定某仓库失败就整个禁用它。
      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: JVM tests
        id: tests
        timeout-minutes: 20
        run: |
          chmod +x gradlew
          ./gradlew testAppDebugUnitTest \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: Lint and architecture
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew lintAppDebug verifyConfigArchitecture \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: Debug build
        if: ${{ !cancelled() && steps.tests.outcome != 'skipped' }}
        timeout-minutes: 20
        run: |
          ./gradlew assembleAppDebug \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --info \
            --continue --no-daemon --no-configuration-cache

      - name: Upload unit test reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-unit-test-reports
          if-no-files-found: warn
          path: |
            app/build/test-results/testAppDebugUnitTest/**
            app/build/reports/tests/testAppDebugUnitTest/**

      - name: Upload lint reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: verify-lint-reports
          if-no-files-found: warn
          path: |
            app/build/reports/lint-results-appDebug.html
            app/build/reports/lint-results-appDebug.xml
            app/build/reports/lint-results-appDebug.txt
            app/build/reports/lint-results-appDebug.sarif
      - name: JVM diagnostics on failure
        if: ${{ always() && (failure() || cancelled()) }}
        run: |
          ps -eo pid,ppid,stat,etime,rss,args
          jps -l | while read -r pid command; do
            if [[ "$command" != *Jps ]]; then
              timeout 10s jcmd "$pid" Thread.print || true
            fi
          done
