name: Build APK for User

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '要构建的分支'
        required: true
        default: 'nas-md3'
      product:
        description: '仅构建 Comic 完整版（漫画增强版）；此工作流为 Debug 验证，正式交付另行签名 Release'
        required: true
        type: choice
        options:
          - appComic
        default: appComic

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PRODUCT: ${{ github.event.inputs.product }}
      PRODUCT_TAG: "${{ github.event.inputs.product == 'appComic' && 'comic' || 'core' }}"
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.inputs.branch }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare official Gradle and Kotlin distributions
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 .github/scripts/prepare_gradle_distribution.py
          python3 .github/scripts/prepare_kotlin_compiler.py

      - name: Clear 18PlusList.txt
        run: |
          echo "清空18PlusList.txt"
          echo "" > $GITHUB_WORKSPACE/app/src/main/assets/18PlusList.txt

      - name: Remove Aliyun mirrors (unreliable in CI)
        run: |
          sed -i '/maven.aliyun.com/d' settings.gradle

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          # appComic -> AppComic：Gradle 变体任务名是驼峰形式
          PRODUCT_CAP=$(echo "$PRODUCT" | awk '{print toupper(substr($0,1,1)) substr($0,2)}')
          ./gradlew assemble${PRODUCT_CAP}Debug \
            --init-script .github/scripts/arm64-only.gradle \
            --project-prop ksp.incremental=false \
            --max-workers=2 --no-parallel --no-daemon --no-configuration-cache
        env:
          COMMIT_NUMBER: ${{ github.run_number }}
          APP_VERSION_NAME: debug-${{ github.run_number }}

      - name: Check Build Output
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/debug"
          echo "检查 APK 输出目录: $APK_PATH"
          ls -la "$APK_PATH" || true
          APK_COUNT=$(find "$APK_PATH" -maxdepth 1 -name "*.apk" | wc -l | tr -d ' ')
          if [ "$APK_COUNT" -ne 1 ]; then
            echo "预期生成 1 个 universal APK，实际生成 $APK_COUNT 个！"
            exit 1
          fi

      - name: Rename APK Files
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/debug"
          cd "$APK_PATH"
          mv -- *.apk "legado-debug-${GITHUB_RUN_NUMBER}-${PRODUCT_TAG}-arm64-v8a.apk"
          ls -la

      - name: Create ZIP Archive
        run: |
          APK_PATH="$GITHUB_WORKSPACE/app/build/outputs/apk/${{ env.PRODUCT }}/debug"
          ZIP_NAME="legado-debug-apks-${GITHUB_RUN_NUMBER}-${PRODUCT_TAG}.zip"
          cd "$APK_PATH"
          zip "$GITHUB_WORKSPACE/$ZIP_NAME" *.apk
          echo "ZIP 文件已创建: $ZIP_NAME"
          ls -la "$GITHUB_WORKSPACE/$ZIP_NAME"

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-${{ env.PRODUCT_TAG }}-${{ github.run_number }}
          path: app/build/outputs/apk/${{ env.PRODUCT }}/debug/*.apk

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: legado-apks-zip-${{ env.PRODUCT_TAG }}-${{ github.run_number }}
          path: legado-debug-apks-*.zip
