# Keep the fork's main branch close to upstream without touching nas-md3.
# This workflow never merges a PR and never resolves merge conflicts.
name: Sync upstream

on:
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: "上游分支（默认 main）"
        required: false
        default: main
        type: string
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPOSITORY: HapeLee/legado-with-MD3
  TARGET_BRANCH: main

jobs:
  sync:
    # Do not let a copy of this workflow open a PR in the canonical repository.
    if: ${{ github.repository != 'HapeLee/legado-with-MD3' }}
    runs-on: ubuntu-latest
    env:
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}

    steps:
      - name: Checkout target branch
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Configure remotes
        shell: bash
        run: |
          set -euo pipefail
          upstream_ref="${UPSTREAM_REF#refs/heads/}"
          if [[ ! "${upstream_ref}" =~ ^[A-Za-z0-9._/-]+$ || "${upstream_ref}" == -* ]]; then
            echo "::error::上游分支名包含不支持的字符。"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPOSITORY}.git"
          git fetch --no-tags upstream "${upstream_ref}"

      - name: Skip while an upstream PR is open
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          existing_url="$(gh pr list \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --state open \
            --json headRefName,url \
            --jq '.[] | select(.headRefName | startswith("automation/sync-upstream-")) | .url' \
            | head -n 1)"
          if [[ -n "${existing_url}" ]]; then
            echo "skip=true" >> "${GITHUB_OUTPUT}"
            echo "已有上游同步 PR，跳过本次运行：${existing_url}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Merge upstream into an isolated branch
        id: merge
        if: steps.existing.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail

          # The input is used only as a ref. Keep the generated branch name safe.
          ref_slug="$(printf '%s' "${UPSTREAM_REF}" \
            | sed 's#[/_]#-#g' \
            | tr -cd '[:alnum:].-')"
          sync_branch="automation/sync-upstream-${ref_slug:-main}-${GITHUB_RUN_ID}"
          upstream_ref="${UPSTREAM_REF#refs/heads/}"

          if ! git rev-parse --verify --quiet "refs/remotes/upstream/${upstream_ref}^{commit}" >/dev/null; then
            echo "::error::找不到 upstream/${upstream_ref}。请确认 workflow 输入的是上游分支名。"
            exit 1
          fi

          git switch --create "${sync_branch}" "origin/${TARGET_BRANCH}"
          if ! git merge --no-commit --no-ff "upstream/${upstream_ref}"; then
            git merge --abort || true
            echo "::error::上游同步发生冲突。工作流不会自动解冲突，也不会修改 nas-md3；请在本地手动处理后重新提交 PR。"
            exit 1
          fi

          if git diff --quiet && git diff --cached --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "main 已包含 upstream/${upstream_ref} 的全部提交。"
            exit 0
          fi

          git commit -m "chore(sync): merge upstream/${upstream_ref}"
          git push --set-upstream origin "${sync_branch}"
          {
            echo "changed=true"
            echo "branch=${sync_branch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Open review PR
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file="${RUNNER_TEMP}/upstream-sync-pr.md"
          cat > "${body_file}" <<EOF
          ## 上游同步

          - 来源：\`https://github.com/${UPSTREAM_REPOSITORY}\`
          - 分支：\`${UPSTREAM_REF}\`
          - 目标：\`${TARGET_BRANCH}\`

          本 PR 只同步 \`${TARGET_BRANCH}\`。NAS 集成保存在 \`nas-md3\`，不会由本工作流覆盖。

          请在合并前运行仓库的 Verify workflow 和必要的 APK 构建。若后续同步出现冲突，关闭本 PR，先在本地手动解决冲突并复核 NAS 改动；本工作流不会自动解冲突或自动合并。
          EOF

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base "${TARGET_BRANCH}" \
            --head "${{ steps.merge.outputs.branch }}" \
            --title "chore(sync): update from upstream/${UPSTREAM_REF}" \
            --body-file "${body_file}"
