name: Sync upstream

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      stage:
        description: 同步阶段
        type: choice
        options: [all, upstream, nas]
        default: all
      upstream_ref:
        description: 上游分支
        type: string
        default: main
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: two-stage-sync
  cancel-in-progress: false

jobs:
  prepare:
    if: github.repository == 'King976567/legado-with-MD3'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      statuses: write
    outputs:
      upstream_sha: ${{ steps.upstream.outputs.upstream_sha }}
      upstream_base: ${{ steps.upstream.outputs.upstream_base }}
      nas_sha: ${{ steps.nas.outputs.nas_sha }}
      nas_base: ${{ steps.nas.outputs.nas_base }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Prepare upstream to main PR
        id: upstream
        if: github.event_name != 'push' && (inputs.stage == '' || inputs.stage == 'all' || inputs.stage == 'upstream')
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_STAGE: upstream
          UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
        run: python3 .github/scripts/sync_pr.py
      # Use a fresh checkout so merged upstream code cannot replace the sync script.
      - uses: actions/checkout@v5
        if: ${{ !cancelled() }}
        with:
          ref: main
          fetch-depth: 0
          path: nas-sync
      - name: Prepare main to NAS PR
        id: nas
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.stage == '' || inputs.stage == 'all' || inputs.stage == 'nas') }}
        working-directory: nas-sync
        env:
          GH_TOKEN: ${{ github.token }}
          SYNC_STAGE: nas
        run: python3 .github/scripts/sync_pr.py

  verify-upstream:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.upstream_sha != '' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/verify-sync.yml
    with:
      ref: ${{ needs.prepare.outputs.upstream_sha }}
      base: ${{ needs.prepare.outputs.upstream_base }}
      stage: upstream

  verify-nas:
    needs: prepare
    if: ${{ !cancelled() && needs.prepare.outputs.nas_sha != '' }}
    permissions:
      contents: read
      statuses: write
    uses: ./.github/workflows/verify-sync.yml
    with:
      ref: ${{ needs.prepare.outputs.nas_sha }}
      base: ${{ needs.prepare.outputs.nas_base }}
      stage: nas
